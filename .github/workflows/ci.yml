name: CI
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-audit --no-fund
      - run: npm run build
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r worker/requirements.txt
      - run: python -m unittest worker.test_worker -v
      - name: Render topic demo
        run: |
          printf '%s' '{"version":1,"mode":"topic","topic":"CI demo story","duration_seconds":5,"script":"A small idea.\nA moving story.","output":{"width":1080,"height":1920}}' > /tmp/demo.json
          python worker/worker.py --manifest /tmp/demo.json --out /tmp/demo-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: ci-demo-render
          path: /tmp/demo-artifacts/
          retention-days: 3
      - name: Render synthetic video-to-animation demo
        run: |
          ffmpeg -y -f lavfi -i testsrc2=size=360x640:rate=24 -f lavfi -i sine=frequency=440:sample_rate=44100 -t 5 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest /tmp/source.mp4
          printf '%s' '{"version":1,"mode":"video","media_path":"/tmp/source.mp4","style":"indian-comic","preserve_audio":true}' > /tmp/video.json
          python worker/worker.py --manifest /tmp/video.json --out /tmp/video-artifacts
          python -c "import json; q=json.load(open('/tmp/video-artifacts/quality-report.json')); assert q['passed'] and q['audio_present'], q"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-video-demo-render
          path: /tmp/video-artifacts/
          retention-days: 3
